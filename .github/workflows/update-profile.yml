name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"        # daily at 03:00 UTC
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - generate_profile.py     # regenerate when you edit the script / PROFILE dict

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Generate SVGs and update README
        env:
          # PROFILE_TOKEN (optional PAT with read:user) includes private-contribution counts.
          # Without it, the built-in token is used and the script falls back to the public page.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          python generate_profile.py \
            --username "${{ github.repository_owner }}" \
            --name "${{ vars.DISPLAY_NAME || github.repository_owner }}"

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-animation.svg terminal-card.svg info-card.svg README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
